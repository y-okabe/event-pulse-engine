services:
  # ── Backend (Express + Socket.IO) ──────────────────────────────────────────
  - type: web
    name: eventpulse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: singapore   # 最寄りのリージョンに変更可
    plan: free          # starter / standard / pro に変更可
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        # 同じ Blueprint 内のフロントエンドサービスの URL を自動参照
        fromService:
          name: eventpulse-frontend
          type: web
          property: host   # → https://eventpulse-frontend.onrender.com 形式

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: eventpulse-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    region: singapore   # backend と同じリージョンを推奨
    plan: free
    envVars:
      - key: BACKEND_URL
        # 同じ Blueprint 内のバックエンドサービスの URL を自動参照
        # → Next.js の rewrites() で実行時に読まれるため build-arg 不要
        fromService:
          name: eventpulse-backend
          type: web
          property: host   # → https://eventpulse-backend.onrender.com 形式
