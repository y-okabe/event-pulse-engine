services:
  # ── Backend (Express + Socket.IO) ──────────────────────────────────────────
  - type: web
    name: eventpulse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: singapore   # 最寄りのリージョンに変更可
    plan: free          # starter / standard / pro に変更可
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        # Render の web サービスに fromService で参照できるのはホスト名のみ。
        # https:// を付けてフル URL にする。
        value: "https://eventpulse-frontend-qer1.onrender.com"

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: eventpulse-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    region: singapore   # backend と同じリージョンを推奨
    plan: free
    # next.config.js の rewrites() は next build 時に評価・焼き込まれるため
    # 環境変数ではなくビルド引数 (buildArgs) で渡す必要がある。
    buildArgs:
      - key: BACKEND_URL
        value: "https://eventpulse-backend-urub.onrender.com"
    envVars:
      - key: BACKEND_URL
        # ランタイム参照用（念のため残す）
        value: "https://eventpulse-backend-urub.onrender.com"
